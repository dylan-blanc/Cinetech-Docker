server {
  listen 80;
  listen 443 ssl http2;
  server_name dblccinetech.fr www.dblccinetech.fr *.dblccinetech.fr;
  
  # Empache l'acces aux dotfiles (.env, .git, etc.) et redirige vers l'accueil
  location ~ (^|/)\.(?!well-known)(?!vite).* {
    # $host renvoi vers le localhost du client et pas du container, $http_host force le localhost en http et non en https
    return 302 http://$http_host/;
  }

  location ^~ /api/ {
    proxy_pass http://backend:3500;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://frontend:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  ssl_certificate /etc/nginx/ssl/cert.pem;
  ssl_certificate_key /etc/nginx/ssl/key.pem;

  server_tokens off;
  }

