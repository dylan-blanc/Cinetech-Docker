services:
  backend:
    container_name: backend
    build:
      context: ./backend
      target: prod
    env_file:
      - ./.env
    expose:
      - "3500"
    restart: unless-stopped

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      target: dev
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    container_name: nginx
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT}:80"
      - "${WEB_SSL_PORT:-443}:443"
    volumes:
      - ./frontend/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./SSL:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
