services:
  backend:
    build:
      context: ./backend
      target: dev
    env_file:
      - ./.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    expose:
      - "3500"

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      # VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
      # VITE_HMR_CLIENT_PORT: ${VITE_HMR_CLIENT_PORT:-8080}
      VITE_API_PROXY_TARGET: http://backend:3500
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    expose:
      - "5173"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./SSL:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
